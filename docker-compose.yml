services:
  ora-src:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ora-src
    hostname: ora-src
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=mig_user
      - APP_USER_PASSWORD=oracle
    deploy:
      resources:
        limits:
          memory: 2.5G
    mem_limit: 2.5g
    volumes:
      - ./init/src:/container-entrypoint-initdb.d:ro
      - ./dpdump:/opt/oracle/dpdump
    networks:
      - mig-net

  ora-tgt:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ora-tgt
    hostname: ora-tgt
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=mig_user
      - APP_USER_PASSWORD=oracle
    deploy:
      resources:
        limits:
          memory: 2.5G
    mem_limit: 2.5g
    volumes:
      - ./init/tgt:/container-entrypoint-initdb.d:ro
      - ./dpdump:/opt/oracle/dpdump
      - ./test_migration.sql:/test_migration.sql:ro
    networks:
      - mig-net

networks:
  mig-net:
    name: mig-net
    driver: bridge
